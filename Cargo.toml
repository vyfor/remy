[workspace]
resolver = "2"
members = [
    "crates/remy",
    "crates/remy-core",
    "crates/remy-macros",
    "examples/counter"
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["vyfor"]
repository = "https://github.com/vyfor/remy"

[workspace.dependencies]
remy-tui = { path = "crates/remy" }
remy-core = { path = "crates/remy-core" }
remy-macros = { path = "crates/remy-macros" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
linkme = "0.3"
dashmap = "6"
arc-swap = "1"
futures-util = "0.3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
